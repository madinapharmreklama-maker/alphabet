<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chex Alifbosi — Interaktiv O'quv</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --bg2: #161820;
  --bg3: #1e2028;
  --card: #1a1c24;
  --card2: #22242e;
  --green: #2ECC8F;
  --green-dim: rgba(46,204,143,0.12);
  --green-dark: #1a9e6a;
  --amber: #F5A623;
  --amber-dim: rgba(245,166,35,0.12);
  --red: #E05A5A;
  --red-dim: rgba(224,90,90,0.12);
  --text: #F0F0F0;
  --text2: #9A9BAA;
  --text3: #5A5B68;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --radius: 12px;
  --radius-sm: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* HEADER */
.hero{
  background: linear-gradient(135deg, #0f1117 0%, #141823 50%, #0f1117 100%);
  border-bottom:1px solid var(--border);
  padding:2.5rem 1.5rem 2rem;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);
  width:400px;height:400px;
  background:radial-gradient(circle, rgba(46,204,143,0.07) 0%, transparent 70%);
  pointer-events:none;
}
.hero-flag{font-size:3rem;margin-bottom:0.75rem;display:block;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(1.6rem,5vw,2.4rem);
  font-weight:400;
  letter-spacing:-0.02em;
  color:var(--text);
  margin-bottom:0.4rem;
}
.hero h1 span{color:var(--green)}
.hero p{font-size:0.9rem;color:var(--text2);max-width:400px;margin:0 auto}

/* STATS */
.stats-row{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  padding:1.25rem 1.5rem;max-width:700px;margin:0 auto;
}
.stat-box{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:0.9rem;text-align:center;
}
.stat-num{font-size:1.6rem;font-weight:600;line-height:1;color:var(--text)}
.stat-num.g{color:var(--green)}
.stat-num.a{color:var(--amber)}
.stat-label{font-size:0.72rem;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:0.06em}

/* PROGRESS */
.progress-wrap{padding:0 1.5rem;max-width:700px;margin:0 auto 0.5rem}
.progress-track{background:var(--bg3);border-radius:99px;height:5px;overflow:hidden}
.progress-fill{
  background:linear-gradient(90deg,var(--green-dark),var(--green));
  height:5px;border-radius:99px;
  transition:width 0.5s cubic-bezier(.4,0,.2,1);width:0%
}
.progress-label{font-size:0.75rem;color:var(--text3);text-align:right;margin-top:5px;padding-bottom:1rem}

/* MODE TABS */
.tabs-wrap{max-width:700px;margin:0 auto;padding:0 1.5rem 1rem}
.tabs{display:flex;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:99px;padding:4px}
.tab{
  flex:1;padding:8px 12px;border-radius:99px;border:none;background:transparent;
  color:var(--text2);cursor:pointer;font-size:0.875rem;font-family:'Outfit',sans-serif;
  font-weight:400;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.tab:hover{color:var(--text)}
.tab.active{background:var(--green);color:#0f1117;font-weight:600}

/* SEARCH */
.search-wrap{max-width:700px;margin:0 auto;padding:0 1.5rem 1rem;position:relative}
.search-icon{position:absolute;left:2.25rem;top:50%;transform:translateY(-50%);font-size:1rem;color:var(--text3)}
.search-input{
  width:100%;padding:0.7rem 1rem 0.7rem 2.8rem;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);font-size:0.9rem;font-family:'Outfit',sans-serif;outline:none;
  transition:border 0.2s,box-shadow 0.2s;
}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,204,143,0.1)}

/* FILTER CHIPS */
.chips-wrap{max-width:700px;margin:0 auto;padding:0 1.5rem 1.25rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:5px 12px;border-radius:99px;
  border:1px solid var(--border);background:transparent;
  color:var(--text2);font-size:0.78rem;font-family:'Outfit',sans-serif;
  cursor:pointer;transition:all 0.15s;
}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip.active{background:var(--green-dim);border-color:rgba(46,204,143,0.4);color:var(--green)}
.chip.amber-chip.active{background:var(--amber-dim);border-color:rgba(245,166,35,0.4);color:var(--amber)}

/* LETTERS GRID */
.main{max-width:700px;margin:0 auto;padding:0 1.5rem}
.section-label{font-size:0.78rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px}
.letters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-bottom:1.25rem}
.letter-btn{
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 8px;cursor:pointer;background:var(--card);
  transition:transform 0.12s,border-color 0.15s,background 0.15s;
  text-align:center;position:relative;
}
.letter-btn:hover{border-color:var(--border2);background:var(--card2);transform:translateY(-2px)}
.letter-btn:active{transform:scale(0.94)}
.letter-btn.selected{border-color:var(--green);background:var(--green-dim)}
.letter-btn.special{border-style:dashed}
.letter-btn.special-amber{border-color:rgba(245,166,35,0.4)}
.ltr-char{font-size:20px;font-weight:600;color:var(--text);line-height:1}
.letter-btn.selected .ltr-char{color:var(--green)}
.ltr-snd{font-size:10px;color:var(--text3);margin-top:4px}
.letter-btn.selected .ltr-snd{color:rgba(46,204,143,0.7)}
.special-dot{
  position:absolute;top:5px;right:5px;width:6px;height:6px;
  border-radius:50%;background:var(--amber);
}

/* DETAIL CARD */
.detail-card{
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--card);padding:1.5rem;margin-bottom:1.5rem;
  animation:fadeIn 0.2s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.detail-top{display:flex;gap:1.5rem;margin-bottom:1.25rem;flex-wrap:wrap;align-items:flex-start}
.big-letter{
  font-family:'Playfair Display',serif;
  font-size:80px;line-height:1;
  color:var(--green);
  min-width:90px;text-align:center;
}
.detail-right{flex:1;min-width:160px}
.detail-name{font-size:1.1rem;font-weight:600;color:var(--text);margin-bottom:4px}
.detail-sound{
  display:inline-block;
  font-size:0.8rem;padding:3px 10px;border-radius:99px;
  background:var(--green-dim);color:var(--green);
  font-weight:500;margin-bottom:10px;letter-spacing:0.03em;
}
.detail-sound.amber{background:var(--amber-dim);color:var(--amber)}
.detail-desc{font-size:0.88rem;color:var(--text2);line-height:1.65}
.special-note{
  display:flex;gap:8px;align-items:flex-start;
  background:var(--amber-dim);border:1px solid rgba(245,166,35,0.25);
  border-radius:var(--radius-sm);padding:10px 12px;
  font-size:0.82rem;color:var(--amber);margin-top:10px;line-height:1.5;
}
.special-note-icon{font-size:1rem;flex-shrink:0;margin-top:1px}
.divider{border:none;border-top:1px solid var(--border);margin:1rem 0}
.ex-title{font-size:0.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px}
.examples-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:7px}
.ex-card{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:9px 12px;
}
.ex-cz{font-size:0.9rem;font-weight:500;color:var(--text)}
.ex-cz .hl{color:var(--green)}
.ex-uz{font-size:0.78rem;color:var(--text3);margin-top:3px}
.empty-state{
  padding:3rem;text-align:center;
  font-size:0.9rem;color:var(--text3);
}

/* QUIZ */
.quiz-wrap{animation:fadeIn 0.2s ease}
.quiz-card{
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--card);padding:2rem 1.5rem;
  text-align:center;margin-bottom:1rem;
}
.q-label{font-size:0.78rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:1rem}
.q-letter{
  font-family:'Playfair Display',serif;
  font-size:96px;line-height:1;
  color:var(--text);margin-bottom:0.5rem;
}
.q-letter small{font-size:32px;color:var(--text3);margin-left:8px}
.q-name{font-size:0.88rem;color:var(--text2);margin-bottom:1.5rem}
.q-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;max-width:500px;margin:0 auto}
.q-opt{
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 16px;cursor:pointer;background:var(--card2);
  color:var(--text);font-size:0.9rem;font-family:'Outfit',sans-serif;
  transition:all 0.15s;text-align:left;line-height:1.4;
}
.q-opt:hover:not(:disabled){border-color:var(--border2);background:var(--bg3);transform:translateY(-1px)}
.q-opt.correct{background:var(--green-dim)!important;border-color:var(--green)!important;color:var(--green)!important;font-weight:600}
.q-opt.wrong{background:var(--red-dim)!important;border-color:var(--red)!important;color:var(--red)!important}
.q-opt-snd{font-size:1rem;font-weight:600;display:block;margin-bottom:2px}
.q-opt-nm{font-size:0.75rem;opacity:0.7}
.q-feedback{
  font-size:0.9rem;margin-top:1.25rem;padding:10px 16px;
  border-radius:var(--radius-sm);display:none;
}
.q-feedback.ok{background:var(--green-dim);color:var(--green);border:1px solid rgba(46,204,143,0.3)}
.q-feedback.fail{background:var(--red-dim);color:var(--red);border:1px solid rgba(224,90,90,0.3)}
.next-btn{
  margin-top:1rem;padding:10px 28px;border:1px solid var(--green);
  border-radius:99px;background:transparent;color:var(--green);
  font-size:0.9rem;font-family:'Outfit',sans-serif;font-weight:500;
  cursor:pointer;transition:all 0.15s;display:none;
}
.next-btn:hover{background:var(--green);color:#0f1117}
.quiz-stats{display:flex;gap:10px;justify-content:center;margin-bottom:1rem;flex-wrap:wrap}
.q-stat{
  padding:6px 16px;border-radius:99px;font-size:0.82rem;font-weight:500;
  border:1px solid var(--border);background:var(--card);
}
.q-stat.g{color:var(--green);border-color:rgba(46,204,143,0.3);background:var(--green-dim)}
.q-stat.r{color:var(--red);border-color:rgba(224,90,90,0.3);background:var(--red-dim)}

/* FOOTER */
footer{
  max-width:700px;margin:0 auto;
  padding:1rem 1.5rem 3rem;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
}
.reset-btn{
  padding:7px 16px;border:1px solid var(--border2);border-radius:var(--radius-sm);
  background:transparent;color:var(--text2);font-size:0.82rem;font-family:'Outfit',sans-serif;
  cursor:pointer;transition:all 0.15s;
}
.reset-btn:hover{background:var(--card2);color:var(--text)}
.footer-tip{font-size:0.78rem;color:var(--text3)}

@media(max-width:500px){
  .big-letter{font-size:56px;min-width:60px}
  .q-letter{font-size:72px}
  .q-options{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="hero">
  <span class="hero-flag">🇨🇿</span>
  <h1>Chex <span>Alifbosi</span></h1>
  <p>42 harf — talaffuz, tavsif va misollar bilan interaktiv o'quv</p>
</header>

<div class="stats-row">
  <div class="stat-box">
    <div class="stat-num">42</div>
    <div class="stat-label">Jami harf</div>
  </div>
  <div class="stat-box">
    <div class="stat-num g" id="learned-num">0</div>
    <div class="stat-label">O'rganildi</div>
  </div>
  <div class="stat-box">
    <div class="stat-num a" id="pct-num">0%</div>
    <div class="stat-label">Natija</div>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
  <div class="progress-label" id="prog-label">0 / 42 harf o'rganildi</div>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab active" id="tab-learn" onclick="setMode('learn')">📖 O'rganish</button>
    <button class="tab" id="tab-quiz" onclick="setMode('quiz')">🧠 Test</button>
  </div>
</div>

<div id="learn-mode">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" type="text" id="search" placeholder="Harf yoki so'z qidirish..." oninput="renderGrid()">
  </div>
  <div class="chips-wrap">
    <div class="chips">
      <button class="chip active" data-filter="all" onclick="setFilter('all',this)">Barchasi</button>
      <button class="chip" data-filter="basic" onclick="setFilter('basic',this)">Oddiy harflar</button>
      <button class="chip amber-chip" data-filter="special" onclick="setFilter('special',this)">⚡ Maxsus harflar</button>
    </div>
  </div>
  <div class="main">
    <div class="section-label" id="grid-label">Harfni bosing — batafsil ma'lumot chiqadi</div>
    <div class="letters-grid" id="letters-grid"></div>
    <div id="detail-area"></div>
  </div>
</div>

<div id="quiz-mode" style="display:none">
  <div class="main">
    <div class="quiz-stats">
      <span class="q-stat g">✓ To'g'ri: <strong id="q-ok">0</strong></span>
      <span class="q-stat r">✗ Xato: <strong id="q-err">0</strong></span>
      <span class="q-stat">Jami: <strong id="q-tot">0</strong></span>
    </div>
    <div class="quiz-card quiz-wrap" id="quiz-card">
      <div class="q-label">Bu harf qanday talaffuz qilinadi?</div>
      <div class="q-letter" id="q-letter"></div>
      <div class="q-name" id="q-name"></div>
      <div class="q-options" id="q-opts"></div>
      <div class="q-feedback" id="q-fb"></div>
      <button class="next-btn" id="next-btn" onclick="nextQ()">Keyingi →</button>
    </div>
  </div>
</div>

<footer>
  <button class="reset-btn" onclick="resetAll()">🔄 Qayta boshlash</button>
  <span class="footer-tip">Sariq nuqta = maxsus harf</span>
</footer>

<script>
const LETTERS = [
  {char:"A a",main:"A",sound:"[a]",name:"A",desc:"O'zbek 'a' harfi kabi. Og'iz keng ochiladi.",special:false,examples:[["ahoj","salom"],["auto","mashina"],["ano","ha"]]},
  {char:"Á á",main:"Á",sound:"[aː]",name:"A uzun",desc:"'a' harfining cho'zilgan talaffuzi — 'aaa' deb uzun aytiladi.",special:true,examples:[["dál","davom et"],["stát","davlat"],["já","men"]]},
  {char:"B b",main:"B",sound:"[b]",name:"Be",desc:"O'zbek 'b' harfi kabi. Lablarni birlashtiring.",special:false,examples:[["být","bo'lmoq"],["banka","bank"],["bratr","aka"]]},
  {char:"C c",main:"C",sound:"[ts]",name:"Tse",desc:"'ts' birikmasidek o'qiladi — 'tsirkus' dagi kabi! Ko'plar yanglishadi.",special:true,examples:[["co","nima"],["cena","narx"],["cukr","shakar"]]},
  {char:"Č č",main:"Č",sound:"[ch]",name:"Che",desc:"O'zbek 'ch' harfi bilan bir xil. 'Choy' so'zidagi 'ch'.",special:true,examples:[["čaj","choy"],["česky","chexcha"],["čau","xayir"]]},
  {char:"D d",main:"D",sound:"[d]",name:"De",desc:"O'zbek 'd' harfi kabi.",special:false,examples:[["den","kun"],["děkuji","rahmat"],["dnes","bugun"]]},
  {char:"Ď ď",main:"Ď",sound:"[dʲ]",name:"De yumshoq",desc:"Yumshoq 'd' — tili tepaga tegib, d+y biriktirib aytiladi. Noyob tovush.",special:true,examples:[["ďábel","shayton"],["Maďarsko","Vengriya"],["ďas","kuchli"]]},
  {char:"E e",main:"E",sound:"[ɛ]",name:"E",desc:"O'zbek 'e' harfi kabi. Ochiq talaffuz.",special:false,examples:[["euro","evro"],["energie","energiya"],["ego","ego"]]},
  {char:"É é",main:"É",sound:"[ɛː]",name:"E uzun",desc:"Uzun 'e' tovushi — cho'zilgan talaffuz.",special:true,examples:[["léto","yoz"],["péct","pishirmoq"],["mléko","sut"]]},
  {char:"Ě ě",main:"Ě",sound:"[jɛ]",name:"E yumshoq",desc:"'ye' kabi o'qiladi — oldingi undoshni yumshatadi.",special:true,examples:[["město","shahar"],["věk","yosh"],["tělo","tana"]]},
  {char:"F f",main:"F",sound:"[f]",name:"Ef",desc:"O'zbek 'f' harfi kabi.",special:false,examples:[["foto","fotosurat"],["film","film"],["fajn","zo'r"]]},
  {char:"G g",main:"G",sound:"[g]",name:"Ge",desc:"O'zbek 'g' harfi kabi. Asosan chet so'zlarda ishlatiladi.",special:false,examples:[["gram","gramm"],["golf","golf"],["galerie","galereya"]]},
  {char:"H h",main:"H",sound:"[ɦ]",name:"Ha",desc:"Yumshoq 'h' — tomoqda hosil bo'ladi, o'zbek 'h'sidan yumshoqroq.",special:false,examples:[["hotel","mehmonxona"],["hodina","soat"],["hlava","bosh"]]},
  {char:"Ch ch",main:"Ch",sound:"[x]",name:"X (ikki harf — bitta tovush)",desc:"Bu IKKITA harf lekin bitta tovush! O'zbek 'x' harfi kabi — 'xabar'dagi 'x'. Alifboda alohida o'rin egallaydi.",special:true,examples:[["chléb","non"],["chlapec","o'g'il bola"],["chci","xohlayman"]]},
  {char:"I i",main:"I",sound:"[ɪ]",name:"I",desc:"Qisqa 'i' tovushi.",special:false,examples:[["inženýr","muhandis"],["informace","ma'lumot"],["internet","internet"]]},
  {char:"Í í",main:"Í",sound:"[iː]",name:"I uzun",desc:"Uzun 'i' tovushi — cho'zilgan talaffuz.",special:true,examples:[["líný","dangasa"],["víno","vino"],["přijít","kelmoq"]]},
  {char:"J j",main:"J",sound:"[j]",name:"Ye",desc:"O'zbek 'y' harfi kabi! 'Yaxshi' so'zidagi 'y'. Ko'plar 'j' deb o'qib yanglishadi.",special:true,examples:[["jídlo","taom"],["jít","bormoq"],["jméno","ism"]]},
  {char:"K k",main:"K",sound:"[k]",name:"Ka",desc:"O'zbek 'k' harfi kabi.",special:false,examples:[["kde","qayerda"],["káva","qahva"],["kolo","velosiped"]]},
  {char:"L l",main:"L",sound:"[l]",name:"El",desc:"O'zbek 'l' harfi kabi.",special:false,examples:[["léto","yoz"],["lístek","chipta"],["levný","arzon"]]},
  {char:"M m",main:"M",sound:"[m]",name:"Em",desc:"O'zbek 'm' harfi kabi.",special:false,examples:[["matka","ona"],["město","shahar"],["mléko","sut"]]},
  {char:"N n",main:"N",sound:"[n]",name:"En",desc:"O'zbek 'n' harfi kabi.",special:false,examples:[["ne","yo'q"],["nový","yangi"],["nádraží","stansiya"]]},
  {char:"Ň ň",main:"Ň",sound:"[nʲ]",name:"En yumshoq",desc:"Ispancha 'ñ' kabi — n+y biriktirib aytiladi. Kam uchraydi.",special:true,examples:[["kůň","ot"],["daň","soliq"],["Španělsko","Ispaniya"]]},
  {char:"O o",main:"O",sound:"[ɔ]",name:"O",desc:"O'zbek 'o' harfi kabi.",special:false,examples:[["otec","ota"],["obchod","do'kon"],["auto","mashina"]]},
  {char:"Ó ó",main:"Ó",sound:"[oː]",name:"O uzun",desc:"Uzun 'o' tovushi. Asosan chet so'zlarda, juda kam uchraydi.",special:true,examples:[["móda","moda"],["módní","modabop"],["Nóbl","nozik"]]},
  {char:"P p",main:"P",sound:"[p]",name:"Pe",desc:"O'zbek 'p' harfi kabi.",special:false,examples:[["prosím","iltimos"],["práce","ish"],["pivo","pivo"]]},
  {char:"R r",main:"R",sound:"[r]",name:"Er",desc:"Titragan 'r' — til uchi tebranadi. Italiancha 'r' ga o'xshash, o'zbek 'r'sidan kuchliroq.",special:false,examples:[["restaurace","restoran"],["rýže","guruch"],["ráno","ertalab"]]},
  {char:"Ř ř",main:"Ř",sound:"[r̝]",name:"Er maxsus",desc:"FAQAT CHEX TILIDA bor noyob tovush! Boshqa hech qaysi tilda yo'q. 'r' va 'zh' ni biriktirib aytiladi.",special:true,examples:[["řeka","daryo"],["říct","aytmoq"],["přijít","kelmoq"]]},
  {char:"S s",main:"S",sound:"[s]",name:"Es",desc:"O'zbek 's' harfi kabi.",special:false,examples:[["syn","o'g'il"],["sestra","singil"],["suv... voda","suv"]]},
  {char:"Š š",main:"Š",sound:"[sh]",name:"Sha",desc:"O'zbek 'sh' harfi bilan bir xil! 'Shahar'dagi 'sh'.",special:true,examples:[["šéf","rahbar"],["špatně","yomon"],["škola","maktab"]]},
  {char:"T t",main:"T",sound:"[t]",name:"Te",desc:"O'zbek 't' harfi kabi.",special:false,examples:[["tam","u yerda"],["týden","hafta"],["tady","bu yerda"]]},
  {char:"Ť ť",main:"Ť",sound:"[tʲ]",name:"Te yumshoq",desc:"Yumshoq 't' — t+y biriktirib aytiladi. Juda kam uchraydi.",special:true,examples:[["ťava","tuya"],["třetí","uchinchi"],["Ťuhýk","turing (qush)"]]},
  {char:"U u",main:"U",sound:"[ʊ]",name:"U",desc:"O'zbek 'u' harfi kabi, lekin qisqaroq.",special:false,examples:[["ulice","ko'cha"],["únor","fevral"],["uber","uber"]]},
  {char:"Ú ú",main:"Ú",sound:"[uː]",name:"U uzun",desc:"Uzun 'u' tovushi — cho'zilgan talaffuz.",special:true,examples:[["úterý","seshanba"],["únor","fevral"],["účet","hisob"]]},
  {char:"Ů ů",main:"Ů",sound:"[uː]",name:"U doira (kroužek)",desc:"Ú bilan talaffuzi bir xil! Faqat yozuvda farq bor. Tarixiy sabab bor.",special:true,examples:[["dům","uy"],["stůl","stol"],["kůň","ot"]]},
  {char:"V v",main:"V",sound:"[v]",name:"Ve",desc:"O'zbek 'v' harfi kabi.",special:false,examples:[["voda","suv"],["víno","vino"],["vlak","poezd"]]},
  {char:"X x",main:"X",sound:"[ks]",name:"Ix",desc:"'ks' birikmasidek — asosan chet so'zlarda ishlatiladi.",special:false,examples:[["extra","a'lo"],["taxi","taksi"],["Xbox","Xbox"]]},
  {char:"Y y",main:"Y",sound:"[ɪ]",name:"Ipsilon",desc:"'i' kabi o'qiladi — amalda farq yo'q. Grammatikada 'hard y' deyiladi.",special:false,examples:[["ty","sen"],["ryba","baliq"],["být","bo'lmoq"]]},
  {char:"Ý ý",main:"Ý",sound:"[iː]",name:"Ipsilon uzun",desc:"'í' kabi o'qiladi — uzun 'i' tovushi.",special:true,examples:[["starý","eski"],["nový","yangi"],["dobrý","yaxshi"]]},
  {char:"Z z",main:"Z",sound:"[z]",name:"Ze",desc:"O'zbek 'z' harfi kabi.",special:false,examples:[["záchrana","tez yordam"],["zdraví","sog'liq"],["zítra","ertaga"]]},
  {char:"Ž ž",main:"Ž",sound:"[ž]",name:"Zha",desc:"Frantsuzcha 'j' kabi — 'Janr' so'zidagi 'j'. Inglizchadagi 'measure'dagi 's'.",special:true,examples:[["žena","ayol"],["žák","o'quvchi"],["život","hayot"]]},
];

const learned = new Set(JSON.parse(localStorage.getItem('cz_alph_v1')||'[]'));
let selectedIdx = 0;
let mode = 'learn';
let filter = 'all';
let qOk=0, qErr=0, qTot=0, qAnswered=false, qIdx=null;

function save(){try{localStorage.setItem('cz_alph_v1',JSON.stringify([...learned]));}catch(e){}}

function updateStats(){
  document.getElementById('learned-num').textContent=learned.size;
  const pct=Math.round(learned.size/LETTERS.length*100);
  document.getElementById('pct-num').textContent=pct+'%';
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('prog-label').textContent=learned.size+' / '+LETTERS.length+' harf o\'rganildi';
}

function getFiltered(){
  const q=document.getElementById('search')?.value.trim().toLowerCase()||'';
  return LETTERS.filter((l,i)=>{
    const matchFilter = filter==='all'||(filter==='special'&&l.special)||(filter==='basic'&&!l.special);
    const matchSearch = !q||(l.char.toLowerCase().includes(q)||l.sound.includes(q)||l.name.toLowerCase().includes(q)||l.examples.some(e=>e[0].toLowerCase().includes(q)||e[1].toLowerCase().includes(q)));
    return matchFilter&&matchSearch;
  });
}

function setFilter(f, el){
  filter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function renderGrid(){
  const items=getFiltered();
  const g=document.getElementById('letters-grid');
  const lbl=document.getElementById('grid-label');
  if(!items.length){g.innerHTML='';document.getElementById('detail-area').innerHTML='<div class="empty-state">Hech narsa topilmadi</div>';lbl.textContent='';return;}
  lbl.textContent=items.length+' ta harf';

  g.innerHTML=items.map(l=>{
    const i=LETTERS.indexOf(l);
    const isSel=i===selectedIdx;
    const isLearned=learned.has(l.main);
    return `<button class="letter-btn${isSel?' selected':''}${l.special?' special':''}${isLearned?' style="border-color:rgba(46,204,143,0.5)"':''}" onclick="selectLetter(${i})">
      ${l.special?'<span class="special-dot" title="Maxsus harf"></span>':''}
      <div class="ltr-char">${l.main}</div>
      <div class="ltr-snd">${l.sound}</div>
    </button>`;
  }).join('');
  renderDetail(selectedIdx);
}

function hl(word, char){
  const letters=char.split('').map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const pat=new RegExp('('+char.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return word.replace(pat,'<span class="hl">$1</span>');
}

function renderDetail(idx){
  const l=LETTERS[idx];
  if(!l){document.getElementById('detail-area').innerHTML='';return;}
  const isLearned=learned.has(l.main);
  document.getElementById('detail-area').innerHTML=`
  <div class="detail-card">
    <div class="detail-top">
      <div class="big-letter">${l.char.split(' ')[0]}</div>
      <div class="detail-right">
        <div class="detail-name">${l.name}</div>
        <span class="detail-sound${l.special?' amber':''}">${l.sound}</span>
        <div class="detail-desc">${l.desc}</div>
        ${l.special?`<div class="special-note"><span class="special-note-icon">⚡</span>Bu harf o'zbekchada yo'q — maxsus e'tibor bering!</div>`:''}
      </div>
    </div>
    <hr class="divider">
    <div class="ex-title">Misollar (harf yashil rang bilan ko'rsatilgan)</div>
    <div class="examples-grid">${l.examples.map(e=>`<div class="ex-card"><div class="ex-cz">${hl(e[0],l.main.toLowerCase())}</div><div class="ex-uz">${e[1]}</div></div>`).join('')}</div>
    <hr class="divider">
    <button onclick="toggleLearned('${l.main}')" style="padding:8px 20px;border-radius:99px;border:1px solid ${isLearned?'rgba(46,204,143,0.5)':'rgba(255,255,255,0.15)'};background:${isLearned?'rgba(46,204,143,0.12)':'transparent'};color:${isLearned?'#2ECC8F':'#9A9BAA'};font-size:0.85rem;font-family:Outfit,sans-serif;cursor:pointer;transition:all 0.15s">${isLearned?'✓ O\'rganildi — bekor qilish':'O\'rganildi deb belgilash'}</button>
  </div>`;
}

function toggleLearned(char){
  if(learned.has(char)) learned.delete(char);
  else learned.add(char);
  save(); updateStats(); renderGrid();
}

function selectLetter(idx){
  selectedIdx=idx;
  renderGrid();
}

/* QUIZ */
function shuffle(a){return[...a].sort(()=>Math.random()-0.5)}

function nextQ(){
  qAnswered=false;
  document.getElementById('next-btn').style.display='none';
  document.getElementById('q-fb').style.display='none';
  const idx=Math.floor(Math.random()*LETTERS.length);
  qIdx=idx;
  const correct=LETTERS[idx];
  const wrongs=shuffle(LETTERS.filter((_,i)=>i!==idx)).slice(0,3);
  const opts=shuffle([correct,...wrongs]);
  document.getElementById('q-letter').innerHTML=correct.char.split(' ')[0]+'<small>'+correct.char.split(' ')[1]+'</small>';
  document.getElementById('q-name').textContent='('+correct.name+')';
  document.getElementById('q-opts').innerHTML=opts.map(o=>`
    <button class="q-opt" onclick="checkQ(this,'${o.main}','${correct.main}')">
      <span class="q-opt-snd">${o.sound}</span>
      <span class="q-opt-nm">${o.name}</span>
    </button>`).join('');
}

function checkQ(btn,chosen,correct){
  if(qAnswered) return;
  qAnswered=true; qTot++;
  document.querySelectorAll('.q-opt').forEach(b=>b.disabled=true);
  document.querySelectorAll('.q-opt').forEach(b=>{
    const nm=b.querySelector('.q-opt-nm').textContent;
    const l=LETTERS.find(x=>x.name===nm);
    if(l&&l.main===correct) b.classList.add('correct');
  });
  const fb=document.getElementById('q-fb');
  if(chosen===correct){qOk++;btn.classList.add('correct');fb.textContent='✓ To\'g\'ri! Barakalla!';fb.className='q-feedback ok';fb.style.display='block';}
  else{qErr++;btn.classList.add('wrong');const cl=LETTERS.find(l=>l.main===correct);fb.textContent='✗ Xato. To\'g\'ri javob: '+cl.sound+' ('+cl.name+')';fb.className='q-feedback fail';fb.style.display='block';}
  document.getElementById('q-ok').textContent=qOk;
  document.getElementById('q-err').textContent=qErr;
  document.getElementById('q-tot').textContent=qTot;
  document.getElementById('next-btn').style.display='inline-block';
}

function setMode(m){
  mode=m;
  document.getElementById('tab-learn').classList.toggle('active',m==='learn');
  document.getElementById('tab-quiz').classList.toggle('active',m==='quiz');
  document.getElementById('learn-mode').style.display=m==='learn'?'':'none';
  document.getElementById('quiz-mode').style.display=m==='quiz'?'':'none';
  if(m==='quiz') nextQ();
}

function resetAll(){
  if(confirm('Barcha belgilarni o\'chirmoqchimisiz?')){learned.clear();save();updateStats();renderGrid();}
}

renderGrid();
updateStats();
</script>
</body>
</html>
